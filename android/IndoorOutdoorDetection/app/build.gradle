plugins {
    id 'com.android.application'
}

android {
    namespace "com.mansour.indooroutdoordetection"
    compileSdk 34

    defaultConfig {
        applicationId "com.mansour.indooroutdoordetection"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // If you log to external storage
        // Avoid "FileUriExposedException" in Android 7+
        manifestPlaceholders = [appAuth: "com.mansour.indooroutdoordetection"]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // Core AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Chart visualization
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Local broadcast
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // Optional: lifecycle runtime if you expand with services
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
}
